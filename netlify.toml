[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# NEXT_PUBLIC_API_URL is set in Netlify > Site configuration > Environment variables
# (e.g. https://nextechcare-backend.vercel.app). It is inlined at build time.

[[plugins]]
  package = "@netlify/plugin-nextjs"
